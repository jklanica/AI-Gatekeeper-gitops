apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-gatekeeper-ingress
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  tls:
    - hosts:
        - local.ai-gatekeeper.com
      secretName: ai-gatekeeper-tls
  rules:
    - host: local.ai-gatekeeper.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
