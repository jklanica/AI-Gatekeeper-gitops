apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow all other external traffic (e.g. to OpenAI)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
