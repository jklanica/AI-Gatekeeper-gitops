apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - config
  - postgres
  - migrator
  - redis
  - proxy
  - web
  - ingress
  - network-policies

helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.10.1
    releaseName: ingress-nginx
    namespace: ingress-nginx
