apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: jklanica/ai-gatekeeper-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ai-gatekeeper-config
                  key: NODE_ENV
            - name: PROXY_PORT
              valueFrom:
                configMapKeyRef:
                  name: ai-gatekeeper-config
                  key: PROXY_PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-gatekeeper-config
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-gatekeeper-secret
                  key: DATABASE_URL
