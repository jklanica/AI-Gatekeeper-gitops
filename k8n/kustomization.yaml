apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Apply your pure manifest files!
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 01-secret.yaml
  - 02-postgres.yaml
  - 02.5-migrator-job.yaml
  - 03-redis.yaml
  - 04-proxy.yaml
  - 05-web.yaml
  - 06-ingress.yaml

# 2. Dynamically download and configure the Ingress Controller Helm chart!
helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.10.1
    releaseName: ingress-nginx
    namespace: ingress-nginx
