# 1. The Internal Network (DNS)
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
---
# 2. The Actual Container
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: jklanica/ai-gatekeeper-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ai-gatekeeper-config
                  key: NODE_ENV
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-gatekeeper-config
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-gatekeeper-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-gatekeeper-secret
                  key: JWT_SECRET
            
            # Since the Web App talks to the Proxy on the server-side, 
            # we can hardcode the internal DNS name here!
            - name: PROXY_BASE_URL
              value: "http://proxy-service:3001/v1"
            
            # The URL shown in user instructions (external)
            - name: EXTERNAL_PROXY_URL
              value: "http://localhost/v1"
