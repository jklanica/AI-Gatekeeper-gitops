apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrator
spec:
  # We only want this to run once successfully
  completions: 1
  
  # If it fails (maybe the DB isn't ready yet), retry up to 4 times
  backoffLimit: 4
  
  template:
    metadata:
      labels:
        app: migrator
    spec:
      # If the command crashes, restart the pod and try again
      restartPolicy: OnFailure
      
      containers:
        - name: migrator
          image: jklanica/ai-gatekeeper-migrator:latest
          imagePullPolicy: IfNotPresent
          env:
            # Inject the exact same DATABASE_URL secret we created in Step 1!
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-gatekeeper-secret
                  key: DATABASE_URL
